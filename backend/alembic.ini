# Alembic (schema migrations). The app migrates itself at startup (core/migrate.py); this file is for the CLI:
#   PYTHONPATH=. python -m alembic -c backend/alembic.ini revision -m "what changes"
#   PYTHONPATH=. python -m alembic -c backend/alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
